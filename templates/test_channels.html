{% extends "base.html" %}

{% block title %}测试频道可用性{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">测试频道可用性</h2>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="group" class="form-label">选择要测试的频道分组</label>
                        <select class="form-select" id="group" name="group">
                            <option value="all" selected>所有频道</option>
                            {% for group in groups %}
                                <option value="{{ group }}">{{ group }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">选择要测试的频道分组。选择"所有频道"将测试所有频道。</div>
                    </div>
                    <div class="alert alert-info">
                        <h5>注意事项</h5>
                        <ul>
                            <li>测试过程可能需要较长时间，取决于频道数量和网络状况</li>
                            <li>测试结果将保存到频道列表中，可以在频道列表页面查看</li>
                            <li>测试结果仅表示当前时间点的可用性，频道状态可能随时变化</li>
                            <li>某些频道可能因为地理限制或其他原因无法访问</li>
                        </ul>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">开始测试</button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
